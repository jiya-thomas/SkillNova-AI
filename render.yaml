databases:
  - name: skillnova-db
    databaseName: skillnova
    user: skillnova_user

services:
  - type: web
    name: skillnova-ai
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn skillNova.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13

      - key: DATABASE_URL
        fromDatabase:
          name: skillnova-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"